# 工作室 NPC「小天」触发事件：Issue/PR 评论 @tdstud1o/npc(小天) 触发云原生构建
# 采用 sunny-mv 已验证的最简配置（官方 default-npc 镜像，无跨仓 secret import）。
# 注：agent-runtime 自定义镜像 + feishu 登录恢复暂缓——agent-secret 的跨仓 import
# 在本仓未获授权会导致流水线起不来（实测 2026-10-06，NPC 无响应）。
"$":
  issue.comment@npc:
    - name: npc-issue
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
  pull_request.comment@npc:
    - name: npc-pr
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
